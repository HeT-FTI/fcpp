verified:
  - repo: HeT-FTI/foc
    run: '42742178868'
    date: '2026-11-10'
    watcher: 1.9.2
    targets:
      - linux-myir-3506-A7
      - linux-orangepi-rk3566-A55
      - linux-orangepi-rk3588-A76
      - linux-orangepi-h6-A53
      - linux-raspberry-bcm2712-A76
