# Dependabot configuration — fresh template repos stay quiet by default.
#
# `open-pull-requests-limit: 0` disables version-update pull requests (and
# therefore dependabot branches) in every repo instantiated from this template.
# Security updates are NOT subject to this limit and still raise PRs for
# vulnerable dependencies. To opt into version updates in your own repo, raise
# the limit or delete this file.
#
# NOTE: this also applies to the template repo itself. Template maintainers
# bump pins manually (or temporarily raise the limit) and validate upgrades
# centrally before shipping them to downstream repos.
version: 2
updates:
  # One grouped PR for all GitHub Actions bumps, on the 3rd of each month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      timezone: Asia/Shanghai
      cronjob: "0 0 3 * *"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 0
    labels:
      - ":bricks: infrastructure"

  # One grouped PR for all npm dev-tooling bumps (semantic-release, commitlint, ajv).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      timezone: Asia/Shanghai
      cronjob: "0 0 3 * *"
    groups:
      dev-tooling:
        patterns:
          - "*"
    open-pull-requests-limit: 0
    labels:
      - ":bricks: infrastructure"
