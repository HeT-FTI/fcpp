name: Docs

# This workflow can be triggered in two ways:
# 1. Via workflow_call from ci-orchestrator.yml (recommended)
# 2. Manually via workflow_dispatch, e.g. to exercise the macOS leg of the docs
#    chain without flipping metadata.workflow_triggers.docs, which stays false
#    in the template.

on:
  workflow_call:
    # No inputs needed - documentation build is self-contained
  workflow_dispatch:

env:
  CONAN_HOME: ~/.conan2

jobs:
  docs:
    name: Build Documentation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A red leg must not cancel the other one: the macOS leg exists precisely
      # to report its own result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt install -y doxygen graphviz

      - name: Install documentation dependencies (macOS)
        if: matrix.os == 'macos-latest'
        # graphviz provides `dot`, which the template relies on: with
        # metadata.graphviz_bin intentionally absent, the empty DOT_PATH makes
        # Doxygen fall back to the `dot` on PATH.
        run: |
          brew install doxygen graphviz

      - name: Install Python documentation dependencies
        run: |
          pip install --only-binary :all: numpy==2.1.3 sphinx==7.4.7 sphinx-intl==2.2.0 sphinx-rtd-theme==2.0.0

      - name: Build documentation
        run: |
          python ./docs/build.py

      - name: Assert the documentation was produced
        shell: bash
        run: |
          status=0
          for f in docs/doxygen/build/docs.html docs/sphinx/build/html/index.html; do
            if [ -f "$f" ]; then
              echo "ok: $f"
            else
              echo "::error::missing documentation artifact: $f"
              status=1
            fi
          done
          # With metadata.graphviz_bin absent the diagrams depend entirely on
          # `dot` being resolvable from PATH, and Doxygen only warns (does not
          # fail) when it is missing -- so check it explicitly.
          if command -v dot >/dev/null 2>&1; then
            echo "ok: $(dot -V 2>&1) (DOT_PATH is empty, so it comes from PATH)"
          else
            echo "::error::graphviz 'dot' is not on PATH; diagrams would be skipped"
            status=1
          fi
          exit $status
