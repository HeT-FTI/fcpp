name: Metadata Controller

# Reusable workflow that analyzes metadata.json and outputs decision flags
# for downstream workflows. This is the single source of truth for
# workflow triggering logic.

on:
  workflow_call:
    inputs:
      event_name:
        description: 'The GitHub event name (push, pull_request, etc.)'
        required: true
        type: string
      commit_messages:
        description: 'Combined commit messages for emoji-based triggers'
        required: false
        type: string
        default: ''
    outputs:
      # Package metadata
      pkg_name:
        description: 'Package name from metadata.json'
        value: ${{ jobs.analyze.outputs.pkg_name }}
      version:
        description: 'Package version from metadata.json'
        value: ${{ jobs.analyze.outputs.version }}
      build_type:
        description: 'Build type (Debug/Release)'
        value: ${{ jobs.analyze.outputs.build_type }}
      
      # Workflow trigger flags
      trigger_build:
        description: 'Whether to trigger build workflow'
        value: ${{ jobs.analyze.outputs.trigger_build }}
      trigger_tests:
        description: 'Whether to trigger test workflow'
        value: ${{ jobs.analyze.outputs.trigger_tests }}
      trigger_release:
        description: 'Whether to trigger release workflow'
        value: ${{ jobs.analyze.outputs.trigger_release }}
      trigger_versioning:
        description: 'Whether to trigger versioning workflow'
        value: ${{ jobs.analyze.outputs.trigger_versioning }}
      trigger_docs:
        description: 'Whether to trigger docs workflow'
        value: ${{ jobs.analyze.outputs.trigger_docs }}
      trigger_security:
        description: 'Whether to trigger security scan workflow'
        value: ${{ jobs.analyze.outputs.trigger_security }}
      
      # Test configuration
      saving_tests_log:
        description: 'Whether to save test logs'
        value: ${{ jobs.analyze.outputs.saving_tests_log }}
      activate_code_coverage:
        description: 'Whether to activate code coverage'
        value: ${{ jobs.analyze.outputs.activate_code_coverage }}

jobs:
  analyze:
    name: Analyze Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Package metadata
      pkg_name: ${{ steps.read_metadata.outputs.pkg_name }}
      version: ${{ steps.read_metadata.outputs.version }}
      build_type: ${{ steps.read_metadata.outputs.build_type }}
      
      # Workflow trigger flags
      trigger_build: ${{ steps.compute_triggers.outputs.trigger_build }}
      trigger_tests: ${{ steps.compute_triggers.outputs.trigger_tests }}
      trigger_release: ${{ steps.compute_triggers.outputs.trigger_release }}
      trigger_versioning: ${{ steps.compute_triggers.outputs.trigger_versioning }}
      trigger_docs: ${{ steps.compute_triggers.outputs.trigger_docs }}
      trigger_security: ${{ steps.compute_triggers.outputs.trigger_security }}
      
      # Test configuration
      saving_tests_log: ${{ steps.read_metadata.outputs.saving_tests_log }}
      activate_code_coverage: ${{ steps.read_metadata.outputs.activate_code_coverage }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read metadata.json
        id: read_metadata
        run: |
          # Read all relevant fields from metadata.json
          pkg_name=$(jq -r '.name // "unknown"' metadata.json)
          version=$(jq -r '.version // "0.0.0"' metadata.json)
          build_type=$(jq -r '.build_type // "Debug"' metadata.json)
          trigger_tests=$(jq -r '.trigger_tests // false | tostring | ascii_downcase' metadata.json)
          saving_tests_log=$(jq -r '.saving_tests_log // false | tostring | ascii_downcase' metadata.json)
          activate_code_coverage=$(jq -r '.activate_code_coverage // false | tostring | ascii_downcase' metadata.json)
          
          # Read workflow_triggers flags (default to true for backward compatibility)
          wf_build=$(jq -r '.workflow_triggers.build // true | tostring | ascii_downcase' metadata.json)
          wf_tests=$(jq -r '.workflow_triggers.tests // true | tostring | ascii_downcase' metadata.json)
          wf_release=$(jq -r '.workflow_triggers.release // true | tostring | ascii_downcase' metadata.json)
          wf_docs=$(jq -r '.workflow_triggers.docs // true | tostring | ascii_downcase' metadata.json)
          wf_versioning=$(jq -r '.workflow_triggers.versioning // true | tostring | ascii_downcase' metadata.json)
          wf_security=$(jq -r '.workflow_triggers.security_scan // true | tostring | ascii_downcase' metadata.json)
          
          # Output all values
          echo "pkg_name=$pkg_name" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "build_type=$build_type" >> $GITHUB_OUTPUT
          echo "trigger_tests=$trigger_tests" >> $GITHUB_OUTPUT
          echo "saving_tests_log=$saving_tests_log" >> $GITHUB_OUTPUT
          echo "activate_code_coverage=$activate_code_coverage" >> $GITHUB_OUTPUT
          echo "wf_build=$wf_build" >> $GITHUB_OUTPUT
          echo "wf_tests=$wf_tests" >> $GITHUB_OUTPUT
          echo "wf_release=$wf_release" >> $GITHUB_OUTPUT
          echo "wf_docs=$wf_docs" >> $GITHUB_OUTPUT
          echo "wf_versioning=$wf_versioning" >> $GITHUB_OUTPUT
          echo "wf_security=$wf_security" >> $GITHUB_OUTPUT
          
          # Log for debugging
          echo "📦 Package: $pkg_name v$version"
          echo "🔧 Build Type: $build_type"
          echo "🧪 Trigger Tests: $trigger_tests"
          echo "📝 Saving Test Logs: $saving_tests_log"
          echo "📊 Code Coverage: $activate_code_coverage"
          echo "🎛️  Workflow Toggles: build=$wf_build tests=$wf_tests release=$wf_release docs=$wf_docs versioning=$wf_versioning security=$wf_security"

      - name: Compute workflow triggers
        id: compute_triggers
        env:
          EVENT_NAME: ${{ inputs.event_name }}
          COMMIT_MESSAGES: ${{ inputs.commit_messages }}
          BUILD_TYPE: ${{ steps.read_metadata.outputs.build_type }}
          TRIGGER_TESTS_FLAG: ${{ steps.read_metadata.outputs.trigger_tests }}
          WF_BUILD: ${{ steps.read_metadata.outputs.wf_build }}
          WF_TESTS: ${{ steps.read_metadata.outputs.wf_tests }}
          WF_RELEASE: ${{ steps.read_metadata.outputs.wf_release }}
          WF_DOCS: ${{ steps.read_metadata.outputs.wf_docs }}
          WF_VERSIONING: ${{ steps.read_metadata.outputs.wf_versioning }}
          WF_SECURITY: ${{ steps.read_metadata.outputs.wf_security }}
        run: |
          # Initialize trigger flags
          trigger_build="false"
          trigger_tests="false"
          trigger_release="false"
          trigger_versioning="false"
          trigger_docs="false"
          trigger_security="false"
          
          # Check commit messages for emoji triggers
          has_build_emoji="false"
          has_test_emoji="false"
          has_release_emoji="false"
          has_docs_emoji="false"
          has_security_emoji="false"
          
          if echo "$COMMIT_MESSAGES" | grep -q ':building_construction:'; then
            has_build_emoji="true"
          fi
          
          if echo "$COMMIT_MESSAGES" | grep -q ':beer:'; then
            has_test_emoji="true"
          fi
          
          if echo "$COMMIT_MESSAGES" | grep -q '(:package:): '; then
            has_release_emoji="true"
          fi
          
          if echo "$COMMIT_MESSAGES" | grep -q ':book:'; then
            has_docs_emoji="true"
          fi
          
          if echo "$COMMIT_MESSAGES" | grep -q ':shield:'; then
            has_security_emoji="true"
          fi
          
          # Compute build trigger
          # Build triggers on :building_construction: emoji on push AND workflow_triggers.build is true
          if [[ "$EVENT_NAME" == "push" && "$has_build_emoji" == "true" && "$WF_BUILD" == "true" ]]; then
            trigger_build="true"
          fi
          
          # Compute test trigger
          # Tests trigger on :beer: emoji on push AND build_type is Debug AND trigger_tests is true AND workflow_triggers.tests is true
          if [[ "$EVENT_NAME" == "push" && "$has_test_emoji" == "true" && "$BUILD_TYPE" == "Debug" && "$TRIGGER_TESTS_FLAG" == "true" && "$WF_TESTS" == "true" ]]; then
            trigger_tests="true"
          fi
          
          # Compute release trigger
          # Release triggers on (:package:): emoji on push AND build_type is Release AND workflow_triggers.release is true
          if [[ "$EVENT_NAME" == "push" && "$has_release_emoji" == "true" && "$BUILD_TYPE" == "Release" && "$WF_RELEASE" == "true" ]]; then
            trigger_release="true"
          fi
          
          # Compute versioning trigger
          # Versioning triggers on push with build_type Release AND NO release emoji AND workflow_triggers.versioning is true
          if [[ "$EVENT_NAME" == "push" && "$has_release_emoji" == "false" && "$BUILD_TYPE" == "Release" && "$WF_VERSIONING" == "true" ]]; then
            trigger_versioning="true"
          fi
          
          # Compute docs trigger
          # Docs trigger on :book: emoji on push AND workflow_triggers.docs is true
          if [[ "$EVENT_NAME" == "push" && "$has_docs_emoji" == "true" && "$WF_DOCS" == "true" ]]; then
            trigger_docs="true"
          fi
          
          # Compute security trigger
          # Security scan triggers on :shield: emoji on push AND workflow_triggers.security_scan is true
          # Also triggers on pull_request events when security_scan is enabled (shift-left security)
          if [[ "$WF_SECURITY" == "true" ]]; then
            if [[ "$EVENT_NAME" == "push" && "$has_security_emoji" == "true" ]]; then
              trigger_security="true"
            fi
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              trigger_security="true"
            fi
          fi
          
          # Output trigger flags
          echo "trigger_build=$trigger_build" >> $GITHUB_OUTPUT
          echo "trigger_tests=$trigger_tests" >> $GITHUB_OUTPUT
          echo "trigger_release=$trigger_release" >> $GITHUB_OUTPUT
          echo "trigger_versioning=$trigger_versioning" >> $GITHUB_OUTPUT
          echo "trigger_docs=$trigger_docs" >> $GITHUB_OUTPUT
          echo "trigger_security=$trigger_security" >> $GITHUB_OUTPUT
          
          # Log trigger decisions
          echo "📋 Workflow Trigger Decisions:"
          echo "  🏗️ Build: $trigger_build"
          echo "  🧪 Tests: $trigger_tests"
          echo "  📦 Release: $trigger_release"
          echo "  🔢 Versioning: $trigger_versioning"
          echo "  📚 Docs: $trigger_docs"
          echo "  🛡️ Security: $trigger_security"
