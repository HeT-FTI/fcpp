name: Release

# Standalone on push to main so it can hold write permissions; gated by workflow_triggers.release

on:
  workflow_call:
    # No inputs needed - this workflow uses secrets
  push:
    branches: [main]

jobs:
  gate:
    name: Release Gate
    # Skip on the template instantiation push (fresh repo, nothing to release).
    if: ${{ github.event_name != 'push' || github.event.commits[0].message != 'Initial commit' }}
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check metadata release trigger
        id: gate
        run: |
          python3 - <<'PY'
          import json
          meta = json.load(open('metadata.json'))
          enabled = bool(meta.get('workflow_triggers', {}).get('release', False))
          print(f'::notice::workflow_triggers.release = {enabled}')
          print(f'should_release={str(enabled).lower()}')
          PY

  auto-release:
    name: Auto Release
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      # snapshot metadata.json first, so we can prove only the version field changed
      - name: Snapshot metadata.json
        run: cp metadata.json /tmp/metadata.pre.json

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--extends` needs an absolute path for .json; repositoryUrl comes from the runner env
          ./node_modules/.bin/semantic-release -r "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --extends "$GITHUB_WORKSPACE/.github/misc/.releaserc.json" 2>&1 | tee /tmp/semantic-release.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Verify metadata.json format preserved
        run: |
          # the release may change ONLY the version field, else the job fails loudly
          python3 - <<'PY'
          import json, difflib, sys
          pre = open('/tmp/metadata.pre.json', encoding='utf-8').read()
          post = open('metadata.json', encoding='utf-8').read()
          json.loads(pre)
          json.loads(post)
          diff = [
              l for l in difflib.unified_diff(pre.splitlines(), post.splitlines(), lineterm='')
              if (l.startswith('+') or l.startswith('-')) and not l.startswith(('+++', '---'))
          ]
          ok = len(diff) == 2 and all('"version"' in l for l in diff)
          if not ok:
              print('::error::metadata.json drifted beyond the version field during release')
              print('\n'.join(diff))
              sys.exit(1)
          print('metadata.json format preserved; only the version field changed')
          PY

      - name: Emit release log
        if: always()
        run: |
          echo "::notice::visible tags: $(git tag -l | tr '\n' ' ')"
          echo "::notice::commits since v1.0.0: $(git rev-list v1.0.0..HEAD --count 2>/dev/null || echo N/A)"
          tail -n 40 /tmp/semantic-release.log | sed 's/^/::notice::/'
