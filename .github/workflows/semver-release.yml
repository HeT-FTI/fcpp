name: Release

# Called by ci-orchestrator.yml with write permissions; gated by workflow_triggers.release

on:
  workflow_call:
    # No inputs needed - this workflow uses secrets

jobs:
  gate:
    name: Release Gate
    # Skip on the template instantiation push (fresh repo, nothing to release).
    if: ${{ github.event_name != 'push' || github.event.commits[0].message != 'Initial commit' }}
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check metadata release trigger
        id: gate
        env:
          # Same predicate as the controller: any commit in a push may carry the release gitmoji, while non-push events have no commits and stay off.
          COMMIT_MESSAGES: ${{ github.event_name == 'push' && join(github.event.commits.*.message, '\n') || '' }}
        run: |
          python3 - <<'PY'
          import json, os
          meta = json.load(open('metadata.json'))
          enabled = bool(meta.get('workflow_triggers', {}).get('release', False))
          requested = '(:package:): ' in os.environ.get('COMMIT_MESSAGES', '')
          should = enabled and requested
          print(f'::notice::workflow_triggers.release = {enabled}')
          print(f'::notice::release gitmoji present = {requested}')
          print(f'::notice::should_release = {should}')
          # a switch grants permission, the gitmoji states intent: both are required
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'should_release={str(should).lower()}\n')
          PY

  auto-release:
    name: Auto Release
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      # snapshot metadata.json first, so we can prove only the version field changed
      - name: Snapshot metadata.json
        run: cp metadata.json /tmp/metadata.pre.json

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--extends` needs an absolute path for .json; repositoryUrl comes from the runner env
          ./node_modules/.bin/semantic-release -r "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --extends "$GITHUB_WORKSPACE/.github/misc/.releaserc.json" 2>&1 | tee /tmp/semantic-release.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Verify metadata.json format preserved
        run: |
          # the release may change ONLY version, plus scaffold for the upstream template
          python3 - <<'PY'
          import json, difflib, sys
          pre = open('/tmp/metadata.pre.json', encoding='utf-8').read()
          post = open('metadata.json', encoding='utf-8').read()
          pre_obj = json.loads(pre)
          post_obj = json.loads(post)
          changed = {key for key in set(pre_obj) | set(post_obj) if pre_obj.get(key) != post_obj.get(key)}
          if not changed:
              print('metadata.json unchanged; no release was produced in this run')
              sys.exit(0)
          diff = [
              l for l in difflib.unified_diff(pre.splitlines(), post.splitlines(), lineterm='')
              if (l.startswith('+') or l.startswith('-')) and not l.startswith(('+++', '---'))
          ]
          allowed = changed in ({"version"}, {"version", "scaffold"})
          ok = allowed and len(diff) in (2, 4) and all(('"version"' in l or '"scaffold"' in l) for l in diff)
          if not ok:
              print('::error::metadata.json drifted beyond version/scaffold during release')
              print('\n'.join(diff))
              sys.exit(1)
          print(f'metadata.json format preserved; changed fields: {sorted(changed)}')
          PY

      - name: Emit release log
        if: always()
        run: |
          echo "::notice::visible tags: $(git tag -l | tr '\n' ' ')"
          # the tag preceding this release, whatever it happens to be: HEAD is the release commit
          prev_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "${prev_tag}" ]; then
            echo "::notice::commits since ${prev_tag}: $(git rev-list "${prev_tag}..HEAD" --count)"
          else
            echo "::notice::no earlier release tag (first release, or nothing to release)"
          fi
          tail -n 40 /tmp/semantic-release.log | sed 's/^/::notice::/'
