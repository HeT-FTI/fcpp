name: Versioning

# This workflow can be triggered in two ways:
# 1. Via workflow_call from ci-orchestrator.yml (recommended)
# 2. Directly on push (for backward compatibility)

on:
  workflow_call:
    # No inputs needed - this workflow uses secrets and git operations

permissions:
  contents: write

jobs:
  auto-versioning:
    name: Auto Versioning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Versioning Script
        run: |
          chmod +x .github/misc/commit_semver.py
          python3 .github/misc/commit_semver.py

      - name: Push Changes
        run: |
          git push origin main
