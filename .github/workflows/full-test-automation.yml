name: Tests

# Called by ci-orchestrator.yml.
#
# Scope: the whole test chain in one place -- unit + stress suites, coverage and artifact
# archive -- because it is the expensive half. It runs on one platform, in the single build
# type metadata.json declares; macOS/Windows legs here are deliberately deferred.

on:
  workflow_call:
    inputs:
      pkg_name:
        description: 'Package name from metadata.json'
        required: true
        type: string
      saving_tests_log:
        description: 'Whether to save test logs'
        required: false
        type: string
        default: 'false'
      activate_code_coverage:
        description: 'Whether to activate code coverage'
        required: false
        type: string
        default: 'false'
      build_type:
        description: 'Build type from metadata.json: this chain has one config, not a matrix'
        required: false
        type: string
        default: 'Debug'

env:
  CONAN_HOME: ~/.conan2

jobs:
  auto-testing:
    name: Auto Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Conan
        run: |
          pip install --only-binary :all: conan==2.31.2

      - name: Set metadata from inputs
        id: read_metadata
        run: |
          # Use inputs from orchestrator (already parsed from metadata.json)
          echo "pkg_name=${{ inputs.pkg_name }}" >> "$GITHUB_OUTPUT"
          echo "trigger=true" >> "$GITHUB_OUTPUT"
          echo "saving=${{ inputs.saving_tests_log }}" >> "$GITHUB_OUTPUT"
          echo "coverage=${{ inputs.activate_code_coverage }}" >> "$GITHUB_OUTPUT"

      - name: Configure Conan
        run: |
          echo "CONAN_HOME=${{ env.CONAN_HOME }}" >> $GITHUB_ENV
          conan profile detect --force

      - name: System dependencies
        run: |
          sudo apt install -y libnsl-dev lcov

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'metadata.json') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Build and test with Conan
        run: |
          conan create . -pr:b=default -pr:h=default -s build_type=${{ inputs.build_type }} --build=missing \
          -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
        timeout-minutes: 55

      - name: Set timestamp
        id: timestamp
        run: |
          echo "timestamp=$(date +%Y-%m-%dT%H_%M_%SZ)" >> $GITHUB_ENV

      - name: Upload test log
        if: >-
          steps.read_metadata.outputs.trigger == 'true' &&
          steps.read_metadata.outputs.saving == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: TestResult-log-${{ env.timestamp }}
          path: test_package/test/export/TestResult.log
          if-no-files-found: warn

      - name: Upload code coverage
        if: >-
          steps.read_metadata.outputs.trigger == 'true' &&
          steps.read_metadata.outputs.coverage == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Coverage-report-${{ env.timestamp }}
          path: test_package/test/export/coverage/
          if-no-files-found: warn

      - name: Assert the coverage report
        if: ${{ inputs.activate_code_coverage == 'true' }}
        # Assert on the artifact, after the upload, so a red gate still archives its evidence.
        run: |
          summary=test_package/test/export/coverage/coverage_summary.json
          report=test_package/test/export/coverage/coverage_report/index.html
          for f in "$summary" "$report"; do
            if [ ! -f "$f" ]; then
              echo "::error::coverage artifact missing: $f"
              exit 1
            fi
          done
          # read the recipe's summary, not genhtml's HTML: the tracefile is upstream, the HTML is a template
          lpct=$(python3 -c "import json;print(json.load(open('$summary'))['lines']['percent'])")
          lhit=$(python3 -c "import json;print(json.load(open('$summary'))['lines']['hit'])")
          lfound=$(python3 -c "import json;print(json.load(open('$summary'))['lines']['found'])")
          fpct=$(python3 -c "import json;print(json.load(open('$summary'))['functions']['percent'])")
          fhit=$(python3 -c "import json;print(json.load(open('$summary'))['functions']['hit'])")
          ffound=$(python3 -c "import json;print(json.load(open('$summary'))['functions']['found'])")
          # the gate stays on lines; functions are reported so a drop is visible, not yet a threshold
          if ! python3 -c 'import sys; sys.exit(0 if float(sys.argv[1]) > 0 else 1)' "$lpct"; then
            echo "::error::line coverage is ${lpct}% (${lhit} of ${lfound} lines) -- expected greater than zero"
            exit 1
          fi
          {
            echo "### Coverage (${{ inputs.build_type }})"
            echo
            echo "| metric | hit | found | rate |"
            echo "| --- | --- | --- | --- |"
            echo "| lines | ${lhit} | ${lfound} | ${lpct}% |"
            echo "| functions | ${fhit} | ${ffound} | ${fpct}% |"
            echo
            echo "| artifact | test_package/test/export/coverage/coverage_report/index.html |"
            echo "| raw summary | test_package/test/export/coverage/coverage_summary.json |"
            echo
            echo "$(lcov --version) | $(genhtml --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up test_package builds
        run: |
          python ./test_package/conanfile.py

      - name: Clean up Conan package
        if: always()
        run: |
          conan remove "${{ steps.read_metadata.outputs.pkg_name }}/*" --confirm

