name: Build CI

# Called by ci-orchestrator.yml; also runs standalone on push/pull_request

on:
  workflow_call:
    inputs:
      pkg_name:
        description: 'Package name from metadata.json'
        required: true
        type: string

env:
  CONAN_HOME: ~/.conan2

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast off: every leg must report its own result
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        exclude:
          - os: windows-latest
            build_type: Debug
          # macOS runs Debug only: it is the leg that exercises clang coverage.
          - os: macos-latest
            build_type: Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Conan
        shell: bash
        run: |
          pip install --only-binary :all: conan==2.31.2

      - name: Install jq (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          choco install jq -y

      - name: Set package name from inputs
        id: read_meta
        shell: bash
        run: |
          # Use input from orchestrator (already parsed from metadata.json)
          echo "pkg_name=${{ inputs.pkg_name }}" >> $GITHUB_OUTPUT

      - name: Configure Conan
        shell: bash
        run: |
          echo "CONAN_HOME=${{ env.CONAN_HOME }}" >> $GITHUB_ENV
          conan profile detect --force

      - name: System dependencies (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt install -y libnsl-dev lcov

      - name: System dependencies (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        # lcov/genhtml are not in the Xcode CLT but the clang coverage path needs them
        run: brew install lcov

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'metadata.json') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Build and test with conanfile
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          conan create . -pr:b=default -pr:h=default -s build_type=${{ matrix.build_type }} --build=missing \
          -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
        timeout-minutes: 55

      - name: Build and test with conanfile (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        # [advisory] Windows conan create has never passed; the Linux legs are the gate
        continue-on-error: true
        run: |
          conan create . -pr:b=default -pr:h=default -s build_type=${{ matrix.build_type }} --build=missing \
          -c tools.system.package_manager:mode=install -c tools.system.package_manager:tool=choco
        timeout-minutes: 55

      - name: Assert the coverage report
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        # assert on the report artifact; both legs, so the Linux/macOS numbers can be compared
        run: |
          report=test_package/test/export/coverage/coverage_report/index.html
          if [ ! -f "$report" ]; then
            echo "::error::coverage report was not produced at $report"
            exit 1
          fi
          pct=$(python3 -c "import re,sys;h=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'headerItem[^>]*>Lines:</td>\s*<td[^>]*>([0-9.]+)',h);print(m.group(1) if m else '')" "$report")
          if [ -z "$pct" ]; then
            echo "::error::no line-coverage rate found in $report"
            exit 1
          fi
          if ! python3 -c 'import sys; sys.exit(0 if float(sys.argv[1]) > 0 else 1)' "$pct"; then
            echo "::error::line coverage is ${pct}% -- expected greater than zero"
            exit 1
          fi
          {
            echo "### Coverage (${{ matrix.os }}, ${{ matrix.build_type }})"
            echo
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| line coverage | ${pct}% |"
            echo "| artifact | test_package/test/export/coverage/coverage_report/index.html |"
            echo
            echo "lcov:    $(lcov --version)"
            echo "genhtml: $(genhtml --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up test_package builds
        shell: bash
        run: |
          python ./test_package/conanfile.py

      - name: Clean up Conan packages
        if: always()
        shell: bash
        run: |
          conan remove "${{ steps.read_meta.outputs.pkg_name }}/*" --confirm
