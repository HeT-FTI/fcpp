package_ref: fcpp/1.0.0

defaults:
  mode: default
  toolchain_version: 11.3.rel1
  create_extra_args: --build=missing --test-folder=

targets:
  - id: linux-myir-3506-A7
    target_key: linux-myir-3506-A7
    default: true
    enabled: true
    build_kind: linux
    os: Linux
    arch: armv7
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: cortex-a7
      target_abi: arm-linux-gnueabihf
      profile_arch: armv7
      artifact_kind: linux-elf
      toolchain_package: auto
      float_abi: hard
      fpu: neon-vfpv4
      extra_cflags: []
      config_rel: platform/bench_config_ci_rk3506.json
      remote_path: /tmp/fcpp_benchmark_myir_3506_a7/benchmark
      deploy_tool: ssh
      ssh_host: ""
      execution_route: ssh-board
      route_id: myir-3506-a7
      route_note: MYIR MYD-YR3506J Linux ARMv7 board route

  - id: linux-orangepi-rk3566-A55
    target_key: linux-orangepi-rk3566-A55
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: armv8
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: cortex-a55
      target_abi: aarch64-linux-gnu
      profile_arch: armv8
      artifact_kind: linux-elf
      toolchain_package: auto
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_aarch64.json
      remote_path: /tmp/fcpp_benchmark_orangepi_3b/benchmark
      deploy_tool: ssh
      ssh_host: ""
      execution_route: ssh-board
      route_id: orangepi-rk3566-a55
      route_note: OrangePi 3B AArch64 board route

  - id: linux-orangepi-h6-A53
    target_key: linux-orangepi-h6-A53
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: armv8
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: cortex-a53
      target_abi: aarch64-linux-gnu
      profile_arch: armv8
      artifact_kind: linux-elf
      toolchain_package: auto
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_aarch64.json
      remote_path: /tmp/fcpp_benchmark_orangepi_3_lts/benchmark
      deploy_tool: ssh
      ssh_host: ""
      execution_route: ssh-board
      route_id: orangepi-h6-a53
      route_note: OrangePi 3 LTS AArch64 board route

  - id: linux-raspberry-bcm2712-A76
    target_key: linux-raspberry-bcm2712-A76
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: armv8
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: cortex-a76
      target_abi: aarch64-linux-gnu
      profile_arch: armv8
      artifact_kind: linux-elf
      toolchain_package: auto
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_aarch64.json
      remote_path: /tmp/fcpp_benchmark_raspberrypi_5/benchmark
      deploy_tool: ssh
      ssh_host: ""
      execution_route: ssh-board
      route_id: raspberry-bcm2712-a76
      route_note: Raspberry Pi 5 AArch64 route is active after 71.89 SSH public-key authorization

  # RISC-V is intentionally paused in this board-CI iteration. Keep the
  # declaration for future recovery but do not include it in any CI matrix.
  - id: linux-riscv64
    default: false
    enabled: false
    build_kind: linux
    os: Linux
    arch: riscv64
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: riscv64
      target_abi: riscv64-linux-gnu-lp64d
      profile_arch: riscv64
      artifact_kind: linux-elf
      toolchain_package: system-gcc-riscv64/13
      compiler_version: "13"
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_riscv64.json
      remote_path: /tmp/fcpp_benchmark_riscv64/benchmark
      deploy_tool: ssh
      ssh_host: root@192.168.1.101
      execution_route: ssh-board
      route_id: pending-linux-riscv64
      route_note: RISC-V CI artifact for 71.89 contract and ABI preflight; execution route is pending board registration

  - id: linux-x86_64
    target_key: linux-x86_64
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: x86_64
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: x86_64
      target_abi: x86_64-linux-gnu
      profile_arch: x86_64
      artifact_kind: linux-elf
      toolchain_package: auto
