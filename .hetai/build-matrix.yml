package_ref: fcpp/1.0.0

defaults:
  mode: default
  toolchain_version: 11.3.rel1
  create_extra_args: --build=missing --test-folder=

targets:
  - id: linux-armv7
    default: true
    enabled: true
    build_kind: linux
    os: Linux
    arch: armv7
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: cortex-a7
      float_abi: hard
      fpu: neon-vfpv4
      extra_cflags: []
      config_rel: platform/bench_config_ci_rk3506.json
      remote_path: /tmp/fcpp_benchmark_fcpp/benchmark
      deploy_tool: ssh
      ssh_host: root@192.168.0.10
      execution_route: ssh-board
      route_id: rk3506-linux-armv7
      route_note: RK3506 Linux armv7 board execution on the 10.12.71.89 watcher

  - id: linux-aarch64
    target_key: linux-aarch64
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: armv8
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: cortex-a53
      target_abi: aarch64-linux-gnu
      profile_arch: armv8
      artifact_kind: elf
      toolchain_package: arm-toolchain/11.3.rel1
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_aarch64.json
      remote_path: /tmp/fcpp_benchmark_aarch64/benchmark
      deploy_tool: ssh
      ssh_host: ""
      execution_route: ssh-board
      route_id: pending-linux-aarch64
      route_note: AArch64 CI artifact for 71.89 contract and ABI preflight; execution route is pending board registration

  - id: linux-riscv64
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: riscv64
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: riscv64
      target_abi: riscv64-linux-gnu-lp64d
      profile_arch: riscv64
      artifact_kind: elf
      toolchain_package: system-gcc-riscv64/13
      compiler_version: "13"
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_riscv64.json
      remote_path: /tmp/fcpp_benchmark_riscv64/benchmark
      deploy_tool: ssh
      ssh_host: root@192.168.1.101
      execution_route: ssh-board
      route_id: pending-linux-riscv64
      route_note: RISC-V CI artifact for 71.89 contract and ABI preflight; execution route is pending board registration

  - id: linux-x86_64
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: x86_64
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: x86_64
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_linux_x86_64.json
      remote_path: /tmp/fcpp_benchmark_host/benchmark
      deploy_tool: local
      ssh_host: ""
      execution_route: local-host
      route_id: watcher-host-linux-x86_64
      route_note: Execute benchmark directly on the watcher host

  - id: baremetal-cortex-m4
    default: false
    enabled: true
    build_kind: baremetal
    os: baremetal
    arch: cortex-m4
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: baremetal
      target_cpu: cortex-m4
      float_abi: hard
      fpu: fpv4-sp-d16
      extra_cflags: []
      config_rel: platform/bench_config_ci_cortex_m4.json
      remote_path: /tmp/fcpp_benchmark_m4/benchmark
      deploy_tool: manual
      ssh_host: ""
      execution_route: manual-placeholder
      route_id: pending-baremetal-cortex-m4
      route_note: Placeholder route until a Cortex-M4 board watcher is provisioned

  - id: baremetal-cortex-m0
    default: false
    enabled: true
    build_kind: baremetal
    os: baremetal
    arch: cortex-m0
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: baremetal
      target_cpu: cortex-m0
      float_abi: soft
      fpu: none
      extra_cflags: []
      config_rel: platform/bench_config_ci_cortex_m0.json
      remote_path: /tmp/fcpp_benchmark_m0/benchmark
      deploy_tool: jlink
      ssh_host: ""
      execution_route: jlink-serial
      route_id: bat32-baremetal-cortex-m0
      route_note: BAT32 Cortex-M0 board execution on the 10.12.71.89 watcher via J-Link and UART
