package_ref: fcpp/1.0.0

defaults:
  mode: default
  toolchain_version: 11.3.rel1
  create_extra_args: --build=missing --test-folder=

targets:
  - id: linux-myir-3506-A7
    target_key: linux-myir-3506-A7
    default: true
    enabled: true
    build_kind: linux
    os: Linux
    arch: armv7
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: cortex-a7
      target_abi: arm-linux-gnueabihf
      profile_arch: armv7
      artifact_kind: linux-elf
      toolchain_package: auto
      float_abi: hard
      fpu: neon-vfpv4
      extra_cflags: []
      config_rel: platform/bench_config_ci_rk3506.json
      remote_path: /tmp/fcpp_benchmark_myir_3506_a7/benchmark
      deploy_tool: ssh
      ssh_host: ""
      execution_route: ssh-board
      route_id: myir-3506-a7
      route_note: MYIR MYD-YR3506J Linux ARMv7 board route

  - id: linux-orangepi-rk3566-A55
    target_key: linux-orangepi-rk3566-A55
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: armv8
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: cortex-a55
      target_abi: aarch64-linux-gnu
      profile_arch: armv8
      artifact_kind: linux-elf
      toolchain_package: auto
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_aarch64.json
      remote_path: /tmp/fcpp_benchmark_orangepi_3b/benchmark
      deploy_tool: ssh
      ssh_host: ""
      execution_route: ssh-board
      route_id: orangepi-rk3566-a55
      route_note: OrangePi 3B AArch64 board route

  - id: linux-orangepi-h6-A53
    target_key: linux-orangepi-h6-A53
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: armv8
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: cortex-a53
      target_abi: aarch64-linux-gnu
      profile_arch: armv8
      artifact_kind: linux-elf
      toolchain_package: auto
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_aarch64.json
      remote_path: /tmp/fcpp_benchmark_orangepi_3_lts/benchmark
      deploy_tool: ssh
      ssh_host: ""
      execution_route: ssh-board
      route_id: orangepi-h6-a53
      route_note: OrangePi 3 LTS AArch64 board route

  - id: linux-raspberry-bcm2712-A76
    target_key: linux-raspberry-bcm2712-A76
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: armv8
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: cortex-a76
      target_abi: aarch64-linux-gnu
      profile_arch: armv8
      artifact_kind: linux-elf
      toolchain_package: auto
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_aarch64.json
      remote_path: /tmp/fcpp_benchmark_raspberrypi_5/benchmark
      deploy_tool: ssh
      ssh_host: ""
      execution_route: ssh-board
      route_id: raspberry-bcm2712-a76
      route_note: Raspberry Pi 5 AArch64 route is active after 71.89 SSH public-key authorization

  # RISC-V is intentionally paused in this board-CI iteration. Keep the
  # declaration for future recovery but do not include it in any CI matrix.
  - id: linux-riscv64
    default: false
    enabled: false
    build_kind: linux
    os: Linux
    arch: riscv64
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: riscv64
      target_abi: riscv64-linux-gnu-lp64d
      profile_arch: riscv64
      artifact_kind: linux-elf
      toolchain_package: system-gcc-riscv64/13
      compiler_version: "13"
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_riscv64.json
      remote_path: /tmp/fcpp_benchmark_riscv64/benchmark
      deploy_tool: ssh
      ssh_host: root@192.168.1.101
      execution_route: ssh-board
      route_id: pending-linux-riscv64
      route_note: RISC-V CI artifact for 71.89 contract and ABI preflight; execution route is pending board registration

  - id: linux-x86_64
    target_key: linux-x86_64
    default: false
    enabled: true
    build_kind: linux
    os: Linux
    arch: x86_64
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: Linux
      target_cpu: x86_64
      target_abi: x86_64-linux-gnu
      profile_arch: x86_64
      artifact_kind: linux-elf
      toolchain_package: auto
      float_abi: ""
      fpu: ""
      extra_cflags: []
      config_rel: platform/bench_config_ci_linux_x86_64.json
      remote_path: /tmp/fcpp_benchmark_host/benchmark
      deploy_tool: local
      ssh_host: ""
      execution_route: local-host
      route_id: watcher-host-linux-x86_64
      route_note: Execute benchmark directly on the watcher host

  - id: baremetal-cortex-m4
    target_key: baremetal-cortex-m4
    default: false
    # There is no provisioned M4 board route. Keep its declaration as a
    # template, but exclude it from the all-mode automated-board matrix.
    enabled: false
    build_kind: baremetal
    os: baremetal
    arch: cortex-m4
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: baremetal
      target_cpu: cortex-m4
      target_abi: arm-none-eabi
      profile_arch: cortex-m4
      artifact_kind: baremetal-bin
      toolchain_package: auto
      float_abi: hard
      fpu: fpv4-sp-d16
      extra_cflags: []
      config_rel: platform/bench_config_ci_cortex_m4.json
      remote_path: /tmp/fcpp_benchmark_m4/benchmark
      deploy_tool: manual
      ssh_host: ""
      execution_route: manual-placeholder
      route_id: pending-baremetal-cortex-m4
      route_note: Placeholder route until Cortex-M4 hardware is provisioned

  - id: baremetal-cortex-m0
    target_key: baremetal-cortex-m0
    default: false
    enabled: true
    build_kind: baremetal
    os: baremetal
    arch: cortex-m0
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: baremetal
      target_cpu: cortex-m0
      target_abi: arm-none-eabi
      profile_arch: cortex-m0
      artifact_kind: baremetal-bin
      toolchain_package: auto
      float_abi: soft
      fpu: none
      extra_cflags: []
      config_rel: platform/bench_config_ci_cortex_m0.json
      remote_path: /tmp/fcpp_benchmark_m0/benchmark
      deploy_tool: jlink
      ssh_host: ""
      execution_route: jlink-serial
      route_id: bat32-baremetal-cortex-m0
      route_note: BAT32 Cortex-M0 route via J-Link and UART

  - id: baremetal-cortex-m3
    target_key: baremetal-cortex-m3
    default: false
    enabled: true
    build_kind: baremetal
    os: baremetal
    arch: cortex-m3
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: baremetal
      target_cpu: cortex-m3
      target_abi: arm-none-eabi
      profile_arch: cortex-m3
      artifact_kind: baremetal-elf
      toolchain_package: auto
      float_abi: soft
      fpu: none
      extra_cflags: []
      config_rel: platform/bench_config_ci_cortex_m3.json
      remote_path: /tmp/fcpp_benchmark_m3/benchmark
      deploy_tool: openocd
      ssh_host: ""
      execution_route: openocd-serial
      route_id: stm32f205-cortex-m3
      route_note: STM32F205 Cortex-M3 route is contract-blocked until 71.89 enables its serial-bound ST-Link inventory entry

  - id: baremetal-cortex-m7
    target_key: baremetal-cortex-m7
    default: false
    enabled: true
    build_kind: baremetal
    os: baremetal
    # cortex-m7d is the Conan build ABI selector; benchmark.profile_arch stays
    # cortex-m7 because the V3 watcher contract identifies the physical core.
    arch: cortex-m7d
    toolchain_versions:
      - 11.3.rel1
    benchmark:
      enabled: true
      target_os: baremetal
      target_cpu: cortex-m7
      target_abi: arm-none-eabi
      profile_arch: cortex-m7
      artifact_kind: baremetal-elf
      toolchain_package: auto
      float_abi: hard
      fpu: fpv5-d16
      extra_cflags: []
      config_rel: platform/bench_config_ci_cortex_m7.json
      remote_path: /tmp/fcpp_benchmark_m7/benchmark
      deploy_tool: jlink
      ssh_host: ""
      execution_route: jlink-serial
      route_id: stm32f767-cortex-m7
      route_note: STM32F767IG Cortex-M7 bundle route is contract-blocked until 71.89 registers its dedicated J-Link probe and inventory entry
